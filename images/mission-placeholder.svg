<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mission preview unavailable</title>
  <desc id="desc">Fallback image used when a mission thumbnail cannot be loaded.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#28124f"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="180" y="150" width="920" height="420" rx="28" fill="#101d34" stroke="#2f4d76" stroke-width="2"/>
  <text x="640" y="330" text-anchor="middle" fill="#d8ebff" font-size="50" font-family="Segoe UI, Arial, sans-serif">Mission Preview</text>
  <text x="640" y="390" text-anchor="middle" fill="#8fb2dc" font-size="28" font-family="Segoe UI, Arial, sans-serif">Image unavailable - fallback engaged</text>
</svg>
